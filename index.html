<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Английский и котики · ЕГЭ</title>
<meta name="description" content="Видеоуроки, скрипты и тренировочный тест по английскому языку для подготовки к ЕГЭ.">
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#A78CEF;      /* основной: на нём только тёмный текст */
  --accent-dark:#5B3FB5; /* белый текст, ссылки, hover */
  --accent-soft:#EEE8FC; /* чипы, плашки, выделения */
  --bg:#FAF8FF;
  --paper:#FFFFFF;
  --ink:#231A4A;
  --muted:#5E5680;       /* вторичный текст, контраст ≥ 5.6:1 */
  --line:#DDD3F5;
  --ok:#2E9E6B;  --ok-bg:#E6F6EE;  --ok-ink:#14634A;
  --bad:#D64550; --bad-bg:#FCE9EB; --bad-ink:#A3202C;
  --r:22px;
  --shadow:0 10px 28px -16px rgba(91,63,181,.45);
  --head:"Rubik","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
img{max-width:100%}
a{color:var(--accent-dark)}
h1,h2,h3{font-family:var(--head);line-height:1.2;margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-dark);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.wrap{width:100%;max-width:1080px;margin-inline:auto;padding-inline:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:14px;border:2px solid transparent;cursor:pointer;
  font:600 1rem var(--head);text-decoration:none;text-align:center;background:var(--accent-dark);color:#fff;transition:transform .15s,background .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);background:#4A3199;box-shadow:var(--shadow)}
.btn.soft{background:var(--accent-soft);color:var(--accent-dark)}
.btn.soft:hover{background:#E2D8FA}
.btn.accent{background:var(--accent);color:var(--ink)}
.btn.accent:hover{background:#9778E8}
.btn.ghost{background:transparent;color:var(--accent-dark);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(250,248,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.brand img{width:46px;height:46px;border-radius:14px;object-fit:cover;flex:none}
.brand span{font:700 1.05rem/1.1 var(--head);color:var(--accent-dark)}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav button{background:none;border:0;cursor:pointer;padding:9px 14px;border-radius:12px;font:600 .95rem var(--head);color:var(--ink)}
.nav button:hover{background:var(--accent-soft);color:var(--accent-dark)}
.bar .btn{padding:9px 18px;font-size:.95rem}

/* ---------- hero ---------- */
main{flex:1;padding-block:22px 64px}
.hero{background:var(--accent);color:var(--ink);border-radius:30px;padding:clamp(24px,5vw,52px);margin-bottom:40px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none}
.hero>*{position:relative;z-index:1}
.badge{display:inline-block;background:var(--accent-dark);color:#fff;font:600 .9rem var(--head);padding:6px 16px;border-radius:999px;margin-bottom:16px}
.hero h1{font-size:clamp(1.9rem,6vw,3.4rem);margin-bottom:14px;text-wrap:balance;overflow-wrap:anywhere}
.hero h1 em{font-style:normal;background:var(--paper);padding:0 .25em;border-radius:.3em;display:inline-block;transform:rotate(-1.5deg)}
.hero p{margin:0 0 22px;max-width:36rem;font-size:1.08rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);color:var(--accent-dark);border:0;cursor:pointer;padding:8px 16px;border-radius:999px;font:600 .92rem var(--head)}
.chip:hover{background:var(--accent-soft)}

.sec{margin-bottom:48px}
.sec>h2{font-size:1.6rem;margin-bottom:6px}
.sec>.lead{margin:0 0 20px;color:var(--muted)}
.sec h3{font-size:1.1rem;margin:26px 0 12px;color:var(--accent-dark)}

/* ---------- карточки ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.ratio{position:relative;aspect-ratio:16/9;background:var(--accent-soft)}
.ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody strong{font:600 1.02rem/1.3 var(--head)}
.cbody .meta{color:var(--muted);font-size:.9rem}
.cbody .actions{margin-top:auto;padding-top:6px}
.cover{aspect-ratio:4/3;object-fit:cover;object-position:top;width:100%;background:var(--accent-soft);display:block;border-bottom:1px solid var(--line)}
.ftype{display:inline-block;align-self:flex-start;background:var(--accent-soft);color:var(--accent-dark);font:600 .8rem var(--head);padding:3px 10px;border-radius:999px}

.practice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;cursor:pointer;border:2px solid var(--accent);background:var(--paper);border-radius:26px;padding:26px;transition:transform .18s,box-shadow .18s,background .18s}
.big:hover{transform:translateY(-4px);box-shadow:var(--shadow);background:var(--accent-soft)}
.big .t{font:700 1.5rem var(--head)}
.big .s{color:var(--muted)}
.big .go{margin-top:6px;background:var(--accent-dark);color:#fff;font:600 .95rem var(--head);padding:8px 18px;border-radius:12px}

footer{border-top:1px solid var(--line);padding-block:24px;background:var(--paper)}
.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.foot img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.foot span{font:600 1rem var(--head)}
.foot a{margin-left:auto}

/* ---------- тест ---------- */
.tbar{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font:600 .98rem var(--head)}
.score b{color:var(--accent-dark)}
.bar-out{height:10px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar-in{height:100%;background:var(--accent-dark);border-radius:99px;transition:width .3s}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.num{min-width:38px;height:38px;border-radius:11px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font:600 .92rem var(--head);padding:0 6px}
.num:hover{border-color:var(--accent-dark)}
.num.cur{border-color:var(--accent-dark);box-shadow:0 0 0 3px var(--accent-soft)}
.num.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink)}
.num.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
.num.ok::after{content:" ✓"}
.num.bad::after{content:" ✗"}

.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,30px)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qn{background:var(--accent-dark);color:#fff;font:700 1rem var(--head);padding:5px 14px;border-radius:12px}
.qtype{background:var(--accent-soft);color:var(--accent-dark);font:600 .85rem var(--head);padding:4px 12px;border-radius:999px}
.qtype.prac{background:#FFF3CF;color:#6B4A00}
.instr{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.stem{font:600 1.1rem/1.45 var(--head);margin:0 0 14px}
.stmts{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.stmts li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.stmts .k{background:var(--accent);color:var(--ink);font:700 .95rem var(--head);border-radius:9px;text-align:center;padding:1px 0}
.src{border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:14px 18px;margin:0 0 16px}
.src h4{font:600 1rem var(--head);margin:0 0 8px;color:var(--accent-dark)}
.src p{margin:0 0 10px}
.src p:last-child{margin:0}
details.src>summary{cursor:pointer;font:600 1rem var(--head);color:var(--accent-dark)}
details.src[open]>summary{margin-bottom:10px}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin-bottom:10px}
.para .k{background:var(--accent-dark);color:#fff;font:700 .95rem var(--head);border-radius:9px;text-align:center;height:28px;line-height:28px}
.gap{display:inline-block;min-width:4.6em;text-align:center;border-bottom:2px solid var(--accent-dark);font:700 .95rem var(--head);color:var(--accent-dark);padding:0 6px;margin-inline:2px}
.gap.cur{background:var(--accent-soft);border-radius:6px 6px 0 0}
.root{display:inline-block;background:var(--accent);color:var(--ink);font:700 .78rem var(--head);padding:1px 8px;border-radius:7px;vertical-align:1px;letter-spacing:.03em}

.audio{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin:0 0 16px}
.audio audio{width:100%;display:block}
.audio .note{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.audio .ph{margin:0;font-weight:600}

.cells{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 16px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.cell .lab{font:700 .95rem var(--head);color:var(--accent-dark)}
.cell input{width:48px;height:52px;text-align:center;font:700 1.25rem var(--head);border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:0}
.cell input:focus{border-color:var(--accent-dark);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.cell .fix{font:700 .85rem var(--head);min-height:1.2em}
.cell.ok input{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink)}
.cell.bad input{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
.cell.ok .fix{color:var(--ok-ink)}
.cell.bad .fix{color:var(--bad-ink)}

.opts{display:grid;gap:8px;margin:0 0 16px}
.opt{display:grid;grid-template-columns:auto 34px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;background:var(--paper)}
.opt:hover{border-color:var(--accent)}
.opt input{width:18px;height:18px;accent-color:var(--accent-dark);margin:0}
.opt .k{background:var(--accent-soft);color:var(--accent-dark);font:700 .95rem var(--head);border-radius:9px;text-align:center;padding:1px 0}
.opt.sel{border-color:var(--accent-dark);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
.opt.ok::after{content:"✓";font-weight:700}
.opt.bad::after{content:"✗";font-weight:700}
.locked .opt{cursor:default}

.wordin{width:100%;max-width:340px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;font:700 1.2rem var(--head);text-transform:uppercase;letter-spacing:.04em;background:var(--paper)}
.wordin::placeholder{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
.wordin:focus{border-color:var(--accent-dark);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.wordin.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink)}
.wordin.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
.hint{margin:8px 0 0;color:var(--muted);font-size:.9rem}
.warn{margin:10px 0 0;color:var(--bad-ink);font-weight:700;min-height:1.4em}

.verdict{display:flex;gap:10px;align-items:flex-start;border:2px solid;border-radius:16px;padding:12px 16px;margin:16px 0 12px;font:600 1.02rem var(--head)}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink)}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
.verdict .ic{font-size:1.3rem;line-height:1.2}
.right{margin:0 0 12px;font-weight:700}
.right .pair{display:inline-block;background:var(--ok-bg);border:1px solid var(--ok);color:var(--ok-ink);border-radius:9px;padding:1px 9px;margin:2px 4px 2px 0;font-family:var(--head)}
.expl{background:var(--bg);border-left:5px solid var(--accent);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.expl h4{margin:0 0 6px;font:600 .95rem var(--head);color:var(--accent-dark)}
.expl p{margin:0 0 8px}
.expl p:last-child{margin:0}
details.script{margin:0 0 12px;border:1px solid var(--line);border-radius:14px;padding:10px 16px;background:var(--paper)}
details.script summary{cursor:pointer;font:600 1rem var(--head);color:var(--accent-dark)}
details.script p{margin:8px 0 0}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ---------- итог ---------- */
.final{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,4vw,40px);text-align:center}
.final .pts{font:700 clamp(3rem,12vw,5.5rem)/1 var(--head);color:var(--accent-dark);margin:6px 0}
.final .pts small{font-size:.35em;color:var(--muted);font-weight:600}
.final .cmt{max-width:34rem;margin:8px auto 20px;font-size:1.1rem;font-weight:600}
.secs{display:grid;gap:10px;max-width:520px;margin:0 auto 22px;text-align:left}
.secs .r{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font:600 .95rem var(--head)}
.secs .bar-out{grid-column:1/-1}
.final .nums{justify-content:center;margin-bottom:22px}
.final .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- вторая часть ---------- */
.p2card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,30px);margin-bottom:18px}
.p2card textarea{width:100%;min-height:200px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;background:var(--paper)}
.p2card textarea:focus{border-color:var(--accent-dark);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.wc{display:flex;justify-content:space-between;gap:10px;margin:6px 0 12px;font-weight:700;color:var(--muted)}
.wc.okc{color:var(--ok-ink)}
.wc.badc{color:var(--bad-ink)}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 16px}
.imgs button{border:2px solid var(--line);border-radius:16px;overflow:hidden;padding:0;cursor:zoom-in;background:var(--paper)}
.imgs img{display:block;width:100%;height:auto}
dialog.zoom{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}
dialog.zoom::backdrop{background:rgba(35,26,74,.8)}
dialog.zoom img{max-width:96vw;max-height:90vh;border-radius:16px;display:block}

@media (max-width:760px){
  html{scroll-padding-top:190px}
  .bar{flex-wrap:wrap;gap:8px}
  .nav{order:3;width:100%;margin-left:0;overflow-x:auto;gap:2px;padding-bottom:2px}
  .nav button{white-space:nowrap;padding:8px 12px}
  .bar .btn{margin-left:auto}
  .grid{grid-template-columns:1fr}
  .opt{grid-template-columns:auto 30px 1fr auto;padding:9px 10px}
  .cell input{width:42px;height:48px}
  .nums{gap:5px}
  .num{min-width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function go(name,opt){
  opt=opt||{};
  if(name==='part2'&&!P2.length)name='home';
  SCREENS.forEach(function(s){$('#screen-'+s).hidden=(s!==name);});
  if(name==='home')renderHome();
  if(name==='test')renderTest();
  if(name==='part2')renderPart2();
  if(!opt.pop)history.pushState({s:name},'','');
  if(opt.scroll){const t=document.getElementById(opt.scroll);if(t)t.scrollIntoView();else window.scrollTo(0,0);}
  else window.scrollTo(0,0);
}
window.addEventListener('popstate',function(e){go((e.state&&e.state.s)||'home',{pop:true});});
function goTo(name,id){go(name,{scroll:id});}

function renderChrome(){
  const items=[];
  if(VIDEOS.length)items.push(['Видео',"goTo('home','videos')"]);
  if(MATERIALS.length)items.push(['Материалы',"goTo('home','materials')"]);
  if(QUIZ.length)items.push(['Тест',"go('test')"]);
  if(P2.length)items.push(['Вторая часть',"go('part2')"]);
  $('#nav').innerHTML=items.map(function(i){return '<button type="button" onclick="'+i[1]+'">'+i[0]+'</button>';}).join('');
  const sb=$('#subBtn');
  if(SITE.subscribeUrl){sb.href=SITE.subscribeUrl;sb.textContent=SITE.subscribeText||'Подписаться';sb.hidden=false;}
  $('#foot').innerHTML='<img src="img/logo.jpg" alt="" width="40" height="40"><span>'+esc(SITE.name)+'</span>'+
    (SITE.subscribeUrl?'<a href="'+esc(SITE.subscribeUrl)+'" target="_blank" rel="noopener">'+esc(SITE.subscribeLabel||SITE.subscribeUrl)+'</a>':'');
}

/* ---------------- главный экран ---------------- */
function kinescopeId(v){const m=String(v).match(/kinescope\.io\/(?:embed\/)?([A-Za-z0-9_-]+)/);return m?m[1]:String(v).trim();}
function fileCard(f){
  const ext=(String(f.path).match(/\.([A-Za-z0-9]+)$/)||[,''])[1].toUpperCase();
  return '<article class="card">'+
    (f.cover?'<img class="cover" loading="lazy" src="'+esc(f.cover)+'" alt="Обложка: '+esc(f.title)+'">':'')+
    '<div class="cbody"><span class="ftype">'+esc(ext)+(f.size?' · '+esc(f.size):'')+'</span>'+
    '<strong>'+esc(f.title)+'</strong>'+(f.desc?'<span class="meta">'+esc(f.desc)+'</span>':'')+
    '<div class="actions"><a class="btn" href="'+esc(f.path)+'" download>'+ICON_DL+'Скачать</a></div></div></article>';
}
function renderHome(){
  let h='';
  h+='<section class="hero"><span class="badge">'+esc(SITE.badge)+'</span><h1>'+esc(SITE.titleBefore)+' <em>'+esc(SITE.titleAccent)+'</em>'+(SITE.titleAfter?' '+esc(SITE.titleAfter):'')+'</h1><p>'+esc(SITE.lead)+'</p><div class="chips">';
  if(VIDEOS.length)h+='<button class="chip" type="button" onclick="goTo(\'home\',\'videos\')">Видеоуроки</button>';
  if(MATERIALS.some(function(m){return m.kind==='script';}))h+='<button class="chip" type="button" onclick="goTo(\'home\',\'scripts\')">Скрипты</button>';
  if(MATERIALS.some(function(m){return m.kind!=='script';}))h+='<button class="chip" type="button" onclick="goTo(\'home\',\'materials\')">Материалы</button>';
  if(QUIZ.length)h+='<button class="chip" type="button" onclick="goTo(\'home\',\'practice\')">Практика</button>';
  h+='</div></section>';

  if(VIDEOS.length){
    h+='<section class="sec" id="videos"><h2>Видеоуроки</h2><p class="lead">Смотрите прямо на странице или откройте видео в Kinescope.</p>';
    const themes=[];VIDEOS.forEach(function(v){if(themes.indexOf(v.theme)<0)themes.push(v.theme);});
    themes.forEach(function(t){
      h+='<h3><span lang="en">'+esc(t)+'</span></h3><div class="grid">';
      VIDEOS.filter(function(v){return v.theme===t;}).forEach(function(v){
        const id=kinescopeId(v.url);
        h+='<article class="card"><div class="ratio"><iframe loading="lazy" src="https://kinescope.io/embed/'+esc(id)+'" title="Видео: '+esc(v.title)+'" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write"></iframe></div>'+
          '<div class="cbody"><strong>'+esc(v.title)+'</strong><div class="actions"><a href="'+esc(v.url)+'" target="_blank" rel="noopener">Открыть на Kinescope ↗</a></div></div></article>';
      });
      h+='</div>';
    });
    h+='</section>';
  }
  [['script','scripts','Скрипты','Тетради с пропусками: заполняйте их во время урока.'],['material','materials','Материалы','Файлы к тесту: распечатайте или откройте на телефоне.']].forEach(function(g){
    const list=MATERIALS.filter(function(m){return (m.kind||'material')===g[0];});
    if(!list.length)return;
    h+='<section class="sec" id="'+g[1]+'"><h2>'+g[2]+'</h2><p class="lead">'+g[3]+'</p><div class="grid">'+list.map(fileCard).join('')+'</div></section>';
  });
  if(QUIZ.length||P2.length){
    h+='<section class="sec" id="practice"><h2>Практика</h2><p class="lead">Проверьте себя: ответы и пояснения появляются сразу после проверки.</p><div class="practice">';
    if(QUIZ.length)h+='<button class="big" type="button" onclick="go(\'test\')"><span class="t">Тест · первая часть</span><span class="s">'+QUIZ.length+' '+pl(QUIZ.length,'задание','задания','заданий')+' · максимум '+pts(maxTotal())+'</span><span class="go">Начать →</span></button>';
    if(P2.length)h+='<button class="big" type="button" onclick="go(\'part2\')"><span class="t">Вторая часть</span><span class="s">Письмо и говорение: условие, эталон и счётчик слов</span><span class="go">Открыть →</span></button>';
    h+='</div></section>';
  }
  $('#screen-home').innerHTML=h;
}

/* ---------------- тест ---------------- */
function maxOf(q){return q.check==='cells'?q.ans.length:1;}
function maxTotal(){return QUIZ.reduce(function(s,q){return s+maxOf(q);},0);}
const ST={i:0,done:{},finished:false};
const AUD={}; // состояние плееров: прослушивания считаются между заданиями

function srcFirst(id){const q=QUIZ.find(function(x){return x.src===id;});return q&&q.n;}
function tokens(text,src,cur){
  return esc(text).replace(/\{\{(\w+)\}\}/g,function(_,k){
    const root=src.roots&&src.roots[k];
    const label=/^\d+$/.test(k)?k:k;
    return '<span class="gap'+(String(cur)===k?' cur':'')+'" aria-label="пропуск '+esc(label)+'">'+esc(label)+'</span>'+(root?' <span class="root">'+esc(root)+'</span>':'');
  });
}
function srcHtml(q){
  if(!q.src)return '';
  const s=SRC[q.src];
  const body=s.text.split('\n\n').map(function(p){return '<p>'+tokens(p,s,q.gap)+'</p>';}).join('');
  const inner=(s.title?'<h4>'+esc(s.title)+'</h4>':'')+'<div lang="en">'+body+'</div>';
  if(srcFirst(q.src)===q.n)return '<div class="src">'+inner+'</div>';
  return '<details class="src"><summary>Показать текст'+(s.title?': '+esc(s.title):'')+'</summary>'+inner+'</details>';
}
function listHtml(q){
  if(!q.list)return '';
  return '<ul class="stmts">'+q.list.map(function(it){return '<li><span class="k">'+esc(it.k)+'</span><span lang="en">'+esc(it.t)+'</span></li>';}).join('')+'</ul>';
}
function parasHtml(q){
  if(!q.paras)return '';
  return q.paras.map(function(p){return '<div class="para"><span class="k">'+esc(p.label)+'</span><p lang="en" style="margin:0">'+esc(p.text)+'</p></div>';}).join('');
}
function audioSlot(q){
  if(!q.audio)return '';
  const a=AUDIO.find(function(x){return x.id===q.audio;});
  return '<div class="audio"><div class="slot" data-a="'+esc(a.id)+'"></div></div>';
}
function ensureAudio(a){
  if(AUD[a.id])return AUD[a.id];
  const st=AUD[a.id]={starts:0,counted:false,locked:false,el:null,note:document.createElement('p')};
  st.note.className='note';
  if(!a.src)return st;
  const el=st.el=document.createElement('audio');
  el.controls=true;el.preload='none';el.src=a.src;
  el.setAttribute('aria-label','Аудиозапись: '+a.title);
  function upd(){
    if(!a.max){st.note.textContent='';return;}
    const left=Math.max(0,a.max-st.starts);
    st.note.textContent=st.locked?'Вы прослушали запись '+a.max+' '+pl(a.max,'раз','раза','раз')+'. Больше слушать нельзя, как на экзамене.':
      'Запись можно прослушать '+a.max+' '+pl(a.max,'раз','раза','раз')+'. Осталось: '+left+'.';
  }
  function lock(){st.locked=true;el.pause();el.removeAttribute('controls');el.style.display='none';upd();}
  el.addEventListener('play',function(){
    if(!a.max)return;
    if(el.currentTime<0.5&&!st.counted){
      if(st.starts>=a.max){lock();return;}
      st.starts++;st.counted=true;upd();
    }
  });
  el.addEventListener('ended',function(){st.counted=false;if(a.max&&st.starts>=a.max)lock();});
  upd();
  return st;
}
function mountAudio(){
  $$('.slot').forEach(function(slot){
    const a=AUDIO.find(function(x){return x.id===slot.dataset.a;});
    const st=ensureAudio(a);
    if(st.el){slot.appendChild(st.el);slot.appendChild(st.note);}
    else slot.innerHTML='<p class="ph">🎧 Аудиозапись скоро появится.</p><p class="note">Скрипт аудирования откроется после проверки задания.</p>';
  });
}
function scriptHtml(q){
  if(!q.audio)return '';
  const a=AUDIO.find(function(x){return x.id===q.audio;});
  if(!a.script||!a.script.length)return '';
  return '<details class="script"><summary>Скрипт аудирования</summary>'+a.script.map(function(l){return '<p><b lang="en">'+esc(l.who)+':</b> <span lang="en">'+esc(l.text)+'</span></p>';}).join('')+'</details>';
}

function answerArea(q,res){
  const done=!!res;
  if(q.check==='cells'){
    let h='<div class="cells" role="group" aria-label="Ответ">';
    for(let k=0;k<q.ans.length;k++){
      const lab=q.labels?q.labels[k]:String(k+1);
      let cls='',val='',fix='';
      if(done){val=res.user[k]||'';const ok=val===q.ans[k];cls=ok?' ok':' bad';fix=ok?'✓':'✗ '+q.ans[k];}
      h+='<div class="cell'+cls+'"><span class="lab">'+esc(lab)+'</span><input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Ответ '+esc(lab)+'" data-k="'+k+'" value="'+esc(val)+'"'+(done?' disabled':'')+'><span class="fix">'+esc(fix)+'</span></div>';
    }
    return h+'</div>';
  }
  if(q.check==='set'){
    return '<input class="wordin'+(done?(res.ok?' ok':' bad'):'')+'" id="setin" style="text-transform:none" inputmode="numeric" autocomplete="off" aria-label="Ответ: цифры" placeholder="Цифры, например 135"'+(done?' value="'+esc(res.user)+'" disabled':'')+'>';
  }
  if(q.check==='choice'){
    let h='<div class="opts" role="radiogroup" aria-label="Варианты ответа">';
    q.options.forEach(function(t,k){
      const key=String(k+1);let cls='';
      if(done){if(key===q.ans)cls=' ok';else if(key===res.user)cls=' bad';}
      h+='<label class="opt'+cls+'"><input type="radio" name="opt" value="'+key+'"'+(done?' disabled':'')+(done&&res.user===key?' checked':'')+'><span class="k">'+key+'</span><span lang="en">'+esc(t)+'</span><span class="sr">'+(done&&key===q.ans?'верный ответ':'')+'</span></label>';
    });
    return h+'</div>';
  }
  if(q.check==='word'){
    return '<input class="wordin'+(done?(res.ok?' ok':' bad'):'')+'" id="wordin" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Ответ для пропуска '+esc(q.gap||q.n)+'" placeholder="Введите слово"'+(done?' value="'+esc(res.user)+'" disabled':'')+'>'+
      (done?'':'<p class="hint">Пишите слитно, как в бланке ЕГЭ.</p>');
  }
  return '';
}
function verdictHtml(q,res){
  const m=maxOf(q);
  const ok=res.pts===m;
  let h='<div class="verdict '+(ok?'ok':'bad')+'" role="status"><span class="ic" aria-hidden="true">'+(ok?'✓':'✗')+'</span><span>'+(ok?'Верно! ':'Неверно. ')+
    (m>1?'Правильных ответов: '+res.pts+' из '+m+'. ':'')+'+'+pts(res.pts)+'</span></div>';
  if(!ok||res.note){
    if(q.check==='cells'){h+='<p class="right">Правильный ответ: '+q.ans.split('').map(function(d,k){return '<span class="pair">'+esc(q.labels?q.labels[k]:k+1)+' → '+d+'</span>';}).join('')+'</p>';}
    else if(q.check==='set')h+='<p class="right">Правильный ответ: <span class="pair">'+esc(q.ans)+'</span></p>';
    else if(q.check==='choice')h+='<p class="right">Правильный ответ: <span class="pair">'+q.ans+'</span> '+en(q.options[+q.ans-1])+'</p>';
    else if(q.check==='word')h+='<p class="right">Правильный ответ: <span class="pair" lang="en">'+esc(q.ans)+'</span></p>';
  }
  if(res.note)h+='<p class="hint">'+esc(res.note)+'</p>';
  return h;
}
function sectionOf(q){return q.section;}

function renderTest(){
  const root=$('#screen-test');
  if(ST.finished){renderFinal(root);return;}
  const q=QUIZ[ST.i],res=ST.done[q.n];
  const answered=Object.keys(ST.done).length;
  const score=Object.keys(ST.done).reduce(function(s,k){return s+ST.done[k].pts;},0);
  let h='<div class="tbar"><div class="trow"><span>Задание '+(ST.i+1)+' из '+QUIZ.length+'</span><span class="score">Баллы: <b>'+score+'</b> из '+maxTotal()+'</span></div>'+
    '<div class="bar-out" role="progressbar" aria-valuemin="0" aria-valuemax="'+QUIZ.length+'" aria-valuenow="'+answered+'" aria-label="Прогресс"><div class="bar-in" style="width:'+Math.round(answered/QUIZ.length*100)+'%"></div></div>'+gridHtml()+'</div>';
  h+='<div class="q'+(res?' locked':'')+'" id="qcard"><div class="qhead"><span class="qn">№ '+esc(q.n)+'</span><span class="qtype'+(q.practice?' prac':'')+'">'+esc(q.label)+(q.practice?' · практика':'')+'</span></div>';
  if(q.instr)h+='<p class="instr">'+esc(q.instr)+'</p>';
  h+=audioSlot(q);
  h+=listHtml(q)+parasHtml(q)+srcHtml(q);
  if(q.stem)h+='<p class="stem" lang="en">'+esc(q.stem)+'</p>';
  h+=answerArea(q,res);
  if(res){
    h+=verdictHtml(q,res);
    if(q.expl&&q.expl.length)h+='<div class="expl"><h4>Пояснение</h4>'+q.expl.map(function(p){return '<p>'+br(p)+'</p>';}).join('')+'</div>';
    h+=scriptHtml(q);
  }else{
    h+='<p class="warn" id="warn" role="alert"></p><button class="btn" type="button" id="checkBtn">Проверить</button>';
  }
  h+='<div class="nav2"><button class="btn soft" type="button" id="prevBtn"'+(ST.i===0?' disabled':'')+'>← Назад</button><button class="btn '+(ST.i===QUIZ.length-1?'accent':'soft')+'" type="button" id="nextBtn">'+(ST.i===QUIZ.length-1?'Завершить':'Дальше →')+'</button></div></div>';
  root.innerHTML=h;
  mountAudio();
  bindTest(q,res);
}
function gridHtml(){
  return '<div class="nums" role="group" aria-label="Номера заданий">'+QUIZ.map(function(q,k){
    const r=ST.done[q.n];
    const cls=(k===ST.i&&!ST.finished?' cur':'')+(r?(r.pts===maxOf(q)?' ok':' bad'):'');
    const st=r?(r.pts===maxOf(q)?', верно':', неверно'):'';
    return '<button type="button" class="num'+cls+'" data-i="'+k+'" aria-label="Задание '+esc(q.n)+st+'"'+(k===ST.i&&!ST.finished?' aria-current="step"':'')+'>'+esc(q.n)+'</button>';
  }).join('')+'</div>';
}
function bindTest(q,res){
  $$('.num',$('#screen-test')).forEach(function(b){b.onclick=function(){ST.finished=false;ST.i=+b.dataset.i;renderTest();window.scrollTo(0,0);};});
  $('#prevBtn').onclick=function(){if(ST.i>0){ST.i--;renderTest();window.scrollTo(0,0);}};
  $('#nextBtn').onclick=function(){
    if(ST.i<QUIZ.length-1){ST.i++;renderTest();window.scrollTo(0,0);return;}
    const left=QUIZ.length-Object.keys(ST.done).length;
    if(left&&!confirm('Без ответа осталось '+left+' '+pl(left,'задание','задания','заданий')+'. Завершить тест?'))return;
    ST.finished=true;renderTest();window.scrollTo(0,0);
  };
  if(res)return;
  $('#checkBtn').onclick=function(){checkQ(q);};
  const cells=$$('.cell input',$('#qcard'));
  cells.forEach(function(inp,k){
    inp.addEventListener('input',function(){
      const v=inp.value.replace(/\D/g,'').slice(-1);
      inp.value=(v&&+v>=1&&+v<=(q.digits||9))?v:'';
      if(inp.value&&cells[k+1])cells[k+1].focus();
    });
    inp.addEventListener('keydown',function(e){
      if(e.key==='Backspace'&&!inp.value&&cells[k-1]){e.preventDefault();cells[k-1].value='';cells[k-1].focus();}
      else if(e.key==='ArrowLeft'&&cells[k-1])cells[k-1].focus();
      else if(e.key==='ArrowRight'&&cells[k+1])cells[k+1].focus();
    });
    inp.addEventListener('focus',function(){inp.select();});
  });
  if(cells[0]&&!q.audio)cells[0].focus({preventScroll:true});
  $$('.opt input',$('#qcard')).forEach(function(r){r.addEventListener('change',function(){$$('.opt',$('#qcard')).forEach(function(o){o.classList.toggle('sel',$('input',o).checked);});});});
  $('#qcard').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&(e.target.tagName==='INPUT')){e.preventDefault();checkQ(q);}
  });
}
function checkQ(q){
  if(ST.done[q.n])return;
  const warn=$('#warn');let user,pt=0,note='';
  if(q.check==='cells'){
    const vals=$$('.cell input',$('#qcard')).map(function(i){return i.value;});
    if(vals.some(function(v){return !v;})){warn.textContent='Заполните все клетки.';return;}
    user=vals;vals.forEach(function(v,k){if(v===q.ans[k])pt++;});
  }else if(q.check==='set'){
    user=$('#setin').value.trim();if(!user){warn.textContent='Введите цифры.';return;}
    const a=Array.from(new Set(user.replace(/\D/g,'').split(''))).sort().join('');
    const b=Array.from(new Set(q.ans.split(''))).sort().join('');
    pt=a===b?1:0;
  }else if(q.check==='choice'){
    const c=$('.opt input:checked',$('#qcard'));
    if(!c){warn.textContent='Выберите вариант ответа.';return;}
    user=c.value;pt=user===q.ans?1:0;
  }else if(q.check==='word'){
    user=$('#wordin').value;const n=norm(user);
    if(!n){warn.textContent='Введите слово.';return;}
    const acc=(q.accept||[q.ans]).map(norm);
    pt=acc.indexOf(n)>=0?1:0;
    if(pt&&/\s/.test(n)&&!/\s/.test(q.ans))note='Засчитано, но в бланке ЕГЭ пишите слитно: '+q.ans+'.';
  }
  ST.done[q.n]={user:user,pts:pt,ok:pt===maxOf(q),note:note};
  renderTest();
  const v=$('.verdict');if(v)v.scrollIntoView({block:'center'});
}
function comment(p){
  const r=RANGES.find(function(x){return p>=x.from&&p<=x.to;})||RANGES[RANGES.length-1];
  return r.text;
}
function renderFinal(root){
  const score=Object.keys(ST.done).reduce(function(s,k){return s+ST.done[k].pts;},0),mx=maxTotal();
  const secs=[];QUIZ.forEach(function(q){let s=secs.find(function(x){return x.name===q.section;});if(!s){s={name:q.section,p:0,m:0};secs.push(s);}s.m+=maxOf(q);if(ST.done[q.n])s.p+=ST.done[q.n].pts;});
  root.innerHTML='<div class="final"><span class="badge">Результат</span><div class="pts">'+score+' <small>из '+mx+'</small></div>'+
    '<p class="cmt">'+esc(comment(score))+'</p>'+
    '<div class="secs">'+secs.map(function(s){return '<div class="r"><span>'+esc(s.name)+'</span><span>'+s.p+' / '+s.m+'</span><div class="bar-out" aria-hidden="true"><div class="bar-in" style="width:'+Math.round(s.p/s.m*100)+'%"></div></div></div>';}).join('')+'</div>'+
    gridHtml()+
    '<div class="row"><button class="btn" type="button" id="again">Пройти заново</button>'+(P2.length?'<button class="btn accent" type="button" id="toP2">Вторая часть</button>':'')+'<button class="btn soft" type="button" id="toHome">На главную</button></div></div>';
  $$('.num',root).forEach(function(b){b.onclick=function(){ST.finished=false;ST.i=+b.dataset.i;renderTest();window.scrollTo(0,0);};});
  $('#again').onclick=function(){ST.i=0;ST.done={};ST.finished=false;Object.keys(AUD).forEach(function(k){delete AUD[k];});renderTest();window.scrollTo(0,0);};
  if(P2.length)$('#toP2').onclick=function(){go('part2');};
  $('#toHome').onclick=function(){go('home');};
}

/* ---------------- вторая часть ---------------- */
const zoom=$('#zoom');
zoom.addEventListener('click',function(){zoom.close();});
function renderPart2(){
  const root=$('#screen-part2');
  let h='<section class="hero"><span class="badge">Вторая часть</span><h1>Письмо и <em>говорение</em></h1><p>Сначала выполните задание сами, потом сравните с эталоном.</p></section>';
  P2.forEach(function(t,k){
    h+='<article class="p2card" data-k="'+k+'"><div class="qhead"><span class="qn">'+esc(t.num||('№ '+(k+1)))+'</span><span class="qtype">'+esc(t.label||'')+'</span></div>';
    if(t.instr)h+='<p class="instr">'+esc(t.instr)+'</p>';
    if(t.q)h+='<p class="stem" lang="en">'+esc(t.q)+'</p>';
    if(t.source){
      const first=P2.findIndex(function(x){return x.source===t.source;})===k;
      const body='<div lang="en">'+esc(t.source).split('\n\n').map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>';
      h+=first?'<div class="src">'+body+'</div>':'<details class="src"><summary>Показать текст</summary>'+body+'</details>';
    }
    if(t.images&&t.images.length)h+='<div class="imgs">'+t.images.map(function(im){return '<button type="button" data-zoom="'+esc(im.src)+'" data-alt="'+esc(im.alt)+'" aria-label="Увеличить: '+esc(im.alt)+'"><img loading="lazy" src="'+esc(im.src)+'" alt="'+esc(im.alt)+'"></button>';}).join('')+'</div>';
    if(t.plan&&t.plan.length)h+='<div class="expl"><h4>План ответа</h4>'+t.plan.map(function(p){return '<p lang="en">'+esc(p)+'</p>';}).join('')+'</div>';
    if(t.kind==='writing'){
      h+='<label class="sr" for="ta'+k+'">Ваш ответ</label><textarea id="ta'+k+'" lang="en" placeholder="Напишите ответ здесь"></textarea><div class="wc" data-min="'+(t.min||0)+'" data-max="'+(t.max||0)+'"><span class="cnt">Слов: 0</span><span>'+(t.min?'нужно '+t.min+(t.max?'–'+t.max:'+'):'')+'</span></div>';
    }
    if(t.sample)h+='<button class="btn soft tog" type="button" aria-expanded="false">Посмотреть ответ</button><div class="expl samp" hidden style="margin-top:12px"><h4>Эталон</h4>'+esc(t.sample).split('\n\n').map(function(p){return '<p lang="en">'+p+'</p>';}).join('')+'</div>';
    h+='</article>';
  });
  root.innerHTML=h;
  $$('textarea',root).forEach(function(ta){
    const wc=ta.parentNode.querySelector('.wc');
    ta.addEventListener('input',function(){
      const n=(ta.value.trim().match(/\S+/g)||[]).length,mn=+wc.dataset.min,mx=+wc.dataset.max;
      wc.querySelector('.cnt').textContent='Слов: '+n;
      wc.className='wc'+(n&&mn?((n>=mn&&(!mx||n<=mx*1.1))?' okc':' badc'):'');
    });
  });
  $$('.tog',root).forEach(function(b){b.onclick=function(){
    const s=b.parentNode.querySelector('.samp'),open=s.hidden;s.hidden=!open;
    b.textContent=open?'Скрыть ответ':'Посмотреть ответ';b.setAttribute('aria-expanded',open);
  };});
  $$('[data-zoom]',root).forEach(function(b){b.onclick=function(){$('#zoomImg').src=b.dataset.zoom;$('#zoomImg').alt=b.dataset.alt;zoom.showModal();};});
}

renderChrome();
document.title=SITE.name+' · ЕГЭ';
history.replaceState({s:'home'},'','');
go('home',{pop:true});
</script>
</body>
</html>
